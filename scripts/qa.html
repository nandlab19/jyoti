<!doctype html><html><head><title>NAND Lab responsive QA</title><style>body{margin:0;background:#444;font:14px Arial;color:white}header{padding:10px}iframe{border:0;display:block;margin:0 auto;height:850px;background:#080808}pre{white-space:pre-wrap;margin:20px}</style></head><body><header id="label"></header><pre id="report"></pre><iframe title="Responsive QA preview"></iframe><script>
const q=new URLSearchParams(location.search),f=document.querySelector('iframe'),label=document.querySelector('#label');
if(q.has('audit')){(async()=>{const routes=await (await fetch('/routes.json')).json();const results=[];for(const w of [360,390,768,1024,1440,1920]){for(const p of routes){label.textContent='Checking '+w+'px '+p;f.style.width=w+'px';await new Promise(resolve=>{f.onload=resolve;f.src=p;});await f.contentDocument.fonts.ready;await new Promise(requestAnimationFrame);const d=f.contentDocument,overflow=d.documentElement.scrollWidth>d.documentElement.clientWidth;results.push({width:w,path:p,overflow,actual:d.documentElement.scrollWidth,client:d.documentElement.clientWidth,font:d.fonts.check('16px Inter')});}}document.querySelector('#report').textContent=JSON.stringify({checks:results.length,failures:results.filter(x=>x.overflow||!x.font),results},null,2);label.textContent='AUDIT COMPLETE';f.hidden=true;})();}else{const w=Number(q.get('width'))||390,p=q.get('path')||'/';f.style.width=w+'px';f.src=p;label.textContent=w+'px / '+p;}
</script></body></html>
